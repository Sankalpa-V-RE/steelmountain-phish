server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index login.html index.html;

    location /api/ {
        proxy_pass https://steelmountain-backend-production.up.railway.app/api/;
        proxy_set_header Host steelmountain-backend-production.up.railway.app;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri.html $uri/ /login.html;
    }
}
